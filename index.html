<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PROICON - Iniciar sesión</title>

    <link rel="stylesheet" href="assets/css/estilos.css">
    <link rel="stylesheet" href="assets/css/corporativo.css">
</head>

<body class="login-body">

    <div class="login-contenedor">

        <div class="login-logo">
            <span class="marca"><img src="assets/img/logo-proicon.jpeg" alt="PROICON - Proyectos Ingeniería y Construcción" width="1179" height="1510"></span>
            <p>Sistema interno de gestión<br>de proyectos de construcción</p>
        </div>

        <div class="login-tarjeta">

            <h2>Iniciar sesión</h2>

            <p class="login-descripcion">
                Ingresa tus datos para acceder al sistema
            </p>

            <form id="formularioLogin">

                <div class="grupo">
                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        autocomplete="username"
                        placeholder="Ingresa tu usuario"
                    >
                </div>

                <div class="grupo">
                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        autocomplete="current-password"
                        placeholder="Ingresa tu contraseña"
                    >
                </div>

                <p id="mensaje" class="mensaje"></p>

                <button type="submit" class="boton-login">
                    Iniciar sesión
                </button>

            </form>

            <div class="registro-enlace">
                <span>Acceso exclusivo para personal autorizado.</span>
                <a href="registro.html">
                    Solicitar acceso
                </a>
            </div>

        </div>

    </div>

    <script src="assets/js/login.js"></script>

    <script src="assets/js/presentacion.js"></script>
</body>
</html>
