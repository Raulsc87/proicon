<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PROICON - Proyectos</title><link rel="stylesheet" href="estilos.css"><link rel="stylesheet" href="proyectos.css"></head>
<body class="body-dashboard"><div class="dashboard"><aside class="menu"><h2>PROICON</h2><p class="texto-usuario">Usuario:</p><p id="nombreUsuario" class="usuario"></p><nav><a href="principal.html">Inicio</a><a href="clientes.html">Clientes</a><a href="proveedores.html">Proveedores</a><a href="materiales.html">Materiales</a><a href="proyectos.html" aria-current="page">Proyectos</a></nav><button id="botonCerrarSesion">Cerrar sesión</button></aside><main class="contenido mantenimiento"><h1>Proyectos</h1><p id="mensajeModulo" class="mensaje" role="status" aria-live="polite"></p><p class="subtitulo">Consulta los proyectos y administra su equipo y presupuesto.</p><div class="barra-mantenimiento"><button id="nuevo" disabled>+ Nuevo proyecto</button><form id="busqueda" class="busqueda"><label for="buscar">Buscar por código o nombre</label><input id="buscar" type="search" maxlength="150"><button>Buscar</button></form></div><section id="proyectoEditor" class="panel-mantenimiento" hidden><h2 id="proyectoTitulo" tabindex="-1">Nuevo proyecto</h2><form id="proyectoForm"><fieldset class="campos-mantenimiento"><div class="grupo"><label for="codigo">Código *</label><input id="codigo" name="codigo" type="text" maxlength="30" required ></div><div class="grupo"><label for="nombre">Nombre *</label><input id="nombre" name="nombre" type="text" maxlength="150" required ></div><div class="grupo"><label for="id_cliente">Cliente *</label><select id="id_cliente" name="id_cliente" required></select></div><div class="grupo"><label for="descripcion">Descripción</label><textarea id="descripcion" name="descripcion" maxlength="100000"></textarea></div><div class="grupo"><label for="ubicacion">Ubicación</label><input id="ubicacion" name="ubicacion" type="text" maxlength="200"  ></div><div class="grupo"><label for="fecha_inicio">Fecha inicio</label><input id="fecha_inicio" name="fecha_inicio" type="date"   ></div><div class="grupo"><label for="fecha_fin_estimada">Fecha fin estimada</label><input id="fecha_fin_estimada" name="fecha_fin_estimada" type="date"   ></div><div class="grupo"><label for="estado">Estado *</label><select id="estado" name="estado" required></select></div><div class="grupo"><label for="estado_avance">Estado de avance *</label><select id="estado_avance" name="estado_avance" required></select></div><div class="grupo"><label for="observaciones">Observaciones</label><textarea id="observaciones" name="observaciones" maxlength="100000"></textarea></div></fieldset><button type="submit">Guardar</button><button type="button" data-cerrar="proyectoEditor">Cerrar formulario</button></form></section><section id="estadoProyectoEditor" class="panel-mantenimiento" hidden><h2 id="estadoProyectoTitulo" tabindex="-1">Cambiar estado</h2><form id="estadoProyectoForm"><fieldset class="campos-mantenimiento"><div class="grupo"><label for="nuevo_estado">Estado</label><select id="nuevo_estado" name="nuevo_estado" required></select></div></fieldset><button type="submit">Guardar</button><button type="button" data-cerrar="estadoProyectoEditor">Cerrar formulario</button></form></section><section class="panel-mantenimiento"><div class="tabla-contenedor"><table><caption class="solo-lectores">Código</caption><thead><tr><th>Código</th><th>Nombre</th><th>Cliente</th><th>Estado</th><th>Avance</th><th>Acciones</th></tr></thead><tbody id="filas"></tbody></table><p id="filasEstado" role="status">Cargando…</p></div></section></main></div><script src="principal.js"></script><script src="proyectos_comun.js"></script><script src="proyectos.js"></script></body></html>
