<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROICON - Empleados</title>
    <link rel="stylesheet" href="assets/css/estilos.css">
    <link rel="stylesheet" href="assets/css/corporativo.css">
    <link rel="stylesheet" href="assets/css/empleados.css">
</head>
<body class="body-dashboard">
<div class="dashboard">
    <aside class="menu">
        <span class="marca"><img src="assets/img/logo-proicon.jpeg" alt="PROICON - Proyectos Ingeniería y Construcción" width="1179" height="1510"></span>
        <p class="texto-usuario">Usuario:</p>
        <p id="nombreUsuario" class="usuario"></p><p id="rolUsuario" class="rol-usuario"></p>
        <nav><a href="principal.html">Inicio</a><a href="clientes.html">Clientes</a><a href="proveedores.html">Proveedores</a><a href="materiales.html">Materiales</a><a href="proyectos.html">Proyectos</a></nav>
        <button id="botonCerrarSesion">Cerrar sesión</button>
    </aside>
    <main class="contenido mantenimiento empleados">
        <h1>Empleados</h1>
        <p class="subtitulo">Personal general de PROICON. Las asignaciones a obras se administran dentro de cada proyecto.</p>
        <p id="mensajeModulo" class="mensaje" role="status" aria-live="polite"></p>
        <div class="barra-mantenimiento">
            <button id="nuevo" type="button" hidden>+ Nuevo empleado</button>
            <form id="busqueda" class="busqueda">
                <label for="buscar">Buscar por nombres, apellidos o correo</label>
                <input id="buscar" type="search" maxlength="120">
                <button type="submit">Buscar</button>
            </form>
        </div>
        <section id="editor" class="panel-mantenimiento" hidden>
            <h2 id="tituloEditor" tabindex="-1">Nuevo empleado</h2>
            <form id="formulario">
                <div id="camposFormulario" class="campos-mantenimiento">
                    <div class="grupo"><label for="nombres">Nombres *</label><input id="nombres" name="nombres" maxlength="80" required></div>
                    <div class="grupo"><label for="apellidos">Apellidos *</label><input id="apellidos" name="apellidos" maxlength="80" required></div>
                    <div class="grupo"><label for="telefono">Teléfono</label><input id="telefono" name="telefono" maxlength="20"></div>
                    <div class="grupo"><label for="correo">Correo</label><input id="correo" name="correo" type="email" maxlength="120"></div>
                    <div class="grupo"><label for="estado">Estado</label><select id="estado" name="estado"><option>ACTIVO</option><option>INACTIVO</option></select></div>
                </div>
                <button id="guardar" type="submit">Guardar</button>
                <button id="cancelar" type="button">Cerrar formulario</button>
            </form>
        </section>
        <div class="tabla-contenedor panel-mantenimiento">
            <table>
                <caption class="solo-lectores">Lista de empleados</caption>
                <thead><tr><th>Nombres</th><th>Apellidos</th><th>Teléfono</th><th>Correo</th><th>Estado</th><th>Acciones</th></tr></thead>
                <tbody id="filas"></tbody>
            </table>
            <p id="estadoLista" role="status">Cargando empleados…</p>
        </div>
    </main>
</div>
<script src="assets/js/principal.js"></script>
<script src="assets/js/empleados.js"></script>
    <script src="assets/js/presentacion.js"></script>
</body>
</html>
